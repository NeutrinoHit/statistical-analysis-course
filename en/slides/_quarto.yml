project:
  type: website
  # Shared films: media.lock.json and _extensions/ link to the repository root
  # (python3 ../neutrinohit-map/scripts/nh_media.py lock . from the root).
  post-render:
    - ../../scripts/strip_notebook_paths.py
    - _extensions/neutrinohit-media/prune.py
  output-dir: ../../_site/en/slides
  resources:
    - applets.html
    - shared/figures/**
    - shared/reveal/**
  render:
    - index.qmd
    - bertrand_paradox.qmd
    - lecture-01-introduction.qmd
    - lecture-02-random-distributions.qmd
    - lecture-03-characteristic-functions.qmd
    - lecture-04-central-limit-theorem.qmd
    - lecture-05-non-gaussian-clt-violations.qmd
    - lecture-06-error-propagation.qmd
    - lecture-07-two-dimensional-gaussian.qmd
    - lecture-08-monte-carlo-method.qmd
    - lecture-09-maximum-likelihood.qmd
    - lecture-10-estimator-properties-profile-likelihood.qmd
    - lecture-11-least-squares-linear-fit.qmd
    - lecture-12-least-squares-systematics.qmd
    - lecture-13-goodness-of-fit-and-significance.qmd
    - notebooks/mc_vegas_notebook.qmd
    - exercises/index.qmd
    - exercises/lecture-01-introduction-exercises.qmd
    - exercises/lecture-02-random-distributions-exercises.qmd
    - exercises/lecture-03-characteristic-functions-exercises.qmd
    - exercises/lecture-04-central-limit-theorem-exercises.qmd
    - exercises/lecture-05-non-gaussian-clt-violations-exercises.qmd
    - exercises/lecture-06-error-propagation-exercises.qmd
    - exercises/lecture-07-two-dimensional-gaussian-exercises.qmd
    - exercises/lecture-08-monte-carlo-method-exercises.qmd
    - exercises/lecture-09-maximum-likelihood-exercises.qmd
    - exercises/lecture-10-estimator-properties-profile-likelihood-exercises.qmd
    - exercises/lecture-11-least-squares-linear-fit-exercises.qmd
    - exercises/lecture-12-least-squares-systematics-exercises.qmd
    - exercises/lecture-13-goodness-of-fit-and-significance-exercises.qmd

