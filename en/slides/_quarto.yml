format:
  html:
    theme: flatly
    css: styles.css
    toc: true
    include-after-body: analytics/cloudflare-web-analytics.html
  revealjs:
    theme: [black, shared/styles/neutrinohit-reveal.scss]
    width: 1600
    height: 1000
    margin: 0.03
    toc: false
    include-after-body:
      - text: |
          <script data-external="1" data-context-home="https://neutrinohit.github.io/en/courses/statistical-analysis.html" data-context-home-label="Course page" src="shared/reveal/neutrinohit-reveal-footer.js"></script>
      - analytics/cloudflare-web-analytics.html
