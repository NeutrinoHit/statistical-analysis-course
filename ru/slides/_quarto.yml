project:
  type: website
  output-dir: _site
  resources:
    - shared/figures/**
    - shared/reveal/**
  render:
    - index.qmd
    - introduction.qmd
    - random-distributions.qmd
    - central-limit-theorem.qmd
    - exercises/index.qmd
    - exercises/introduction.qmd
    - exercises/random-distributions.qmd
    - exercises/central-limit-theorem.qmd

website:
  title: "Статистический анализ данных: слайды"

format:
  html:
    theme: flatly
    css: styles.css
    toc: false
    page-layout: full
  revealjs:
    width: 1600
    height: 900
    margin: 0.03
    toc: true
    toc-depth: 1
    toc-title: "План лекции"
    include-after-body:
      text: |
        <script data-external="1" data-context-home="index.html" data-context-home-label="Главная страница курса" src="shared/reveal/neutrinohit-reveal-footer.js"></script>
