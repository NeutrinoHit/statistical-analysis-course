website:
  title: "Статистический анализ данных: слайды"

format:
  html:
    theme: flatly
    css: styles.css
    toc: false
    page-layout: full
    include-after-body: analytics/cloudflare-web-analytics.html
  revealjs:
    width: 1600
    height: 900
    margin: 0.03
    toc: true
    toc-depth: 1
    toc-title: "План лекции"
    include-after-body:
      - text: |
          <script data-external="1" data-context-home="https://neutrinohit.github.io/ru/education.html#stat" data-context-home-label="Карта курса статистики" src="shared/reveal/neutrinohit-reveal-footer.js"></script>
      - analytics/cloudflare-web-analytics.html
