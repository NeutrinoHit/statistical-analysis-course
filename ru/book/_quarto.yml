project:
  type: book
  output-dir: ../../_site/ru/book

book:
  title: "Статистический анализ данных"
  output-file: statistical-data-analysis
  subtitle: "От вероятности к физическому результату"
  author: "Дмитрий В. Наумов"
  site-url: "https://neutrinohit.github.io/statistical-analysis-course/ru/book/"
  repo-url: "https://github.com/NeutrinoHit/statistical-analysis-course"
  repo-subdir: "ru/book"
  repo-actions: [source, issue]
  search: true
  reader-mode: true
  downloads: [pdf, epub]
  page-footer:
    left: "© Дмитрий В. Наумов"
    right: "NeutrinoHit · Статистический анализ данных"
  chapters:
    - index.qmd
    - preface.qmd
    - part: "I. Вероятностный язык"
      chapters:
        - chapters/why_statistics.qmd
        - chapters/01_random_distributions.qmd
        - chapters/02_characteristic_functions.qmd
        - chapters/03_central_limit_theorem.qmd
        - chapters/04_non_gaussian_clt_violations.qmd
    - part: "II. Моделирование и оценивание"
      chapters:
        - chapters/05_error_propagation_and_covariance.qmd
        - chapters/06_monte_carlo_method.qmd
        - chapters/07_parameter_estimation_and_maximum_likelihood.qmd
        - chapters/08_method_of_least_squares.qmd
    - part: "III. Статистический вывод"
      chapters:
        - chapters/09_statistical_tests_basics.qmd
        - chapters/10_test_statistics_and_multivariate_methods.qmd
        - chapters/11_goodness_of_fit_and_significance.qmd
        - chapters/12_feldman_cousins_and_cls.qmd
        - chapters/13_interval_estimation_and_limits.qmd
    - part: "IV. Неопределённости и альтернативный вывод"
      chapters:
        - chapters/14_nuisance_parameters_and_systematics.qmd
        - chapters/15_bayesian_examples.qmd

bibliography: ../../shared/bib/references.bib
csl: ../../shared/bib/neutrinohit-numeric.csl
link-citations: true
lang: ru
jupyter: python3

# Quarto exposes both parts and chapters as level-1 headers to Lua filters.
# The shared book layer uses this profile data to reserve chapter-only furniture.
book-part-titles:
  - "I. Вероятностный язык"
  - "II. Моделирование и оценивание"
  - "III. Статистический вывод"
  - "IV. Неопределённости и альтернативный вывод"

filters:
  - assets/filters/hide-book-index.lua
  - assets/filters/neutrinohit-book.lua

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    grid:
      sidebar-width: 260px
      body-width: 1050px
      margin-width: 230px
      gutter-width: 1rem
    css:
      - assets/styles/neutrinohit-book.css
      - assets/styles/book.css
    include-in-header:
      - ../../shared/html/mathjax.html
    include-after-body: analytics/cloudflare-web-analytics.html
    theme: cosmo
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-responsive: true
  pdf:
    documentclass: scrbook
    classoption:
      - open=any
    papersize: a4
    fontsize: 11pt
    # Printed TOC is inserted by book-pdf-style.tex immediately after the title page.
    toc: false
    toc-depth: 1
    toc-title: "Содержание"
    number-sections: true
    number-depth: 3
    colorlinks: true
    pdf-engine: lualatex
    keep-tex: true
    geometry:
      - top=18mm
      - bottom=20mm
      - inner=20mm
      - outer=50mm
      - marginparwidth=36mm
      - marginparsep=6mm
      - headheight=6mm
      - headsep=5mm
      - footskip=9mm
    filters:
      - assets/filters/book-pdf-style.lua
    include-in-header:
      - ../../shared/latex/neutrinohit-book.tex
      - ../../shared/latex/ru-lang.tex
      - assets/latex/book-pdf-style.tex
  epub:
    toc: true
    toc-depth: 2
    number-sections: true
    css:
      - assets/styles/neutrinohit-book.css
      - assets/styles/book.css
