project:
  type: book
  output-dir: ../../_site/ru/book

book:
  title: "Статистический анализ данных"
  subtitle: "От вероятности к физическому результату"
  author: "Дмитрий В. Наумов"
  site-url: "https://neutrinohit.github.io/statistical-analysis-course/ru/book/"
  repo-url: "https://github.com/NeutrinoHit/statistical-analysis-course"
  repo-subdir: "ru/book"
  repo-actions: [source, issue]
  search: true
  reader-mode: true
  page-footer:
    left: "© Дмитрий В. Наумов"
    right: "NeutrinoHit · Статистический анализ данных"
  chapters:
    - index.qmd
    - preface.qmd
    - syllabus.qmd
    - part: "I. Вероятностный язык"
      chapters:
        - chapters/why_statistics.qmd
        - chapters/01_random_distributions.qmd
        - chapters/02_characteristic_functions.qmd
        - chapters/03_central_limit_theorem.qmd
        - chapters/04_non_gaussian_clt_violations.qmd
    - part: "II. Моделирование и оценивание"
      chapters:
        - chapters/05_error_propagation_and_covariance.qmd
        - chapters/06_monte_carlo_method.qmd
        - chapters/07_parameter_estimation_and_maximum_likelihood.qmd
        - chapters/08_method_of_least_squares.qmd
    - part: "III. Статистический вывод"
      chapters:
        - chapters/09_statistical_tests_basics.qmd
        - chapters/10_test_statistics_and_multivariate_methods.qmd
        - chapters/11_goodness_of_fit_and_significance.qmd
        - chapters/12_feldman_cousins_and_cls.qmd
        - chapters/13_interval_estimation_and_limits.qmd
    - part: "IV. Неопределённости и альтернативный вывод"
      chapters:
        - chapters/14_nuisance_parameters_and_systematics.qmd
        - chapters/15_bayesian_examples.qmd

bibliography: ../../shared/bib/references.bib
lang: ru

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    grid:
      sidebar-width: 260px
      body-width: 1050px
      margin-width: 230px
      gutter-width: 1rem
    css: assets/styles/book.css
    include-in-header:
      - ../../shared/html/mathjax.html
    include-after-body: analytics/cloudflare-web-analytics.html
    theme: cosmo
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-responsive: true
  pdf:
    documentclass: scrbook
    toc: true
    number-sections: true
    pdf-engine: lualatex
    include-in-header:
      - ../../shared/latex/common-pdf.tex
      - ../../shared/latex/ru-lang.tex
