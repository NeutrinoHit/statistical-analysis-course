project:
  type: book
  output-dir: ../../_site/ru/book
  resources:
    - assets/covers/**

book:
  title: "Статистический анализ данных"
  output-file: statistical-data-analysis
  subtitle: "От вероятности к физическому результату"
  author: "Дмитрий В. Наумов"
  site-url: "https://neutrinohit.github.io/statistical-analysis-course/ru/book/"
  repo-url: "https://github.com/NeutrinoHit/statistical-analysis-course"
  repo-subdir: "ru/book"
  repo-actions: [source, issue]
  search: true
  reader-mode: true
  downloads: [pdf]
  page-footer:
    left: "© Дмитрий В. Наумов"
    right: "NeutrinoHit · Статистический анализ данных"
  chapters:
    - index.qmd
    - preface.qmd
    - part: "I. Вероятностный язык"
      chapters:
        - chapters/01_why_statistics.qmd
        - chapters/02_random_distributions.qmd
        - chapters/03_characteristic_functions.qmd
        - chapters/04_central_limit_theorem.qmd
        - chapters/05_non_gaussian_clt_violations.qmd
    - part: "II. Моделирование и оценивание"
      chapters:
        - chapters/06_error_propagation.qmd
        - chapters/07_two_dimensional_gaussian.qmd
        - chapters/08_monte_carlo_method.qmd
        - chapters/09_maximum_likelihood.qmd
        - chapters/10_estimator_properties_profile_likelihood.qmd
        - chapters/11_least_squares_linear_fit.qmd
        - chapters/12_least_squares_systematics.qmd
    - part: "III. Статистический вывод"
      chapters:
        - chapters/13_goodness_of_fit_and_significance.qmd

bibliography: ../../shared/bib/references.bib
csl: ../../shared/bib/neutrinohit-numeric.csl
# Each chapter has its own numbered list of sources. The generic Pandoc citeproc
# pass sees a PDF/EPUB book as one document and repeats the full bibliography at
# every #refs Div, so chapter-bibliographies.lua runs citeproc for each chapter.
citeproc: false
# Citation links are disabled because a source can occur in several chapter
# bibliographies with the same internal reference identifier.
link-citations: false
lang: ru
jupyter: python3

# Quarto exposes both parts and chapters as level-1 headers to Lua filters.
# The shared book layer uses this profile data to reserve chapter-only furniture.
book-part-titles:
  - "I. Вероятностный язык"
  - "II. Моделирование и оценивание"
  - "III. Статистический вывод"

filters:
  - assets/filters/chapter-bibliographies.lua
  - assets/filters/hide-book-index.lua
  - assets/filters/neutrinohit-book.lua

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    grid:
      sidebar-width: 260px
      body-width: 1050px
      margin-width: 230px
      gutter-width: 1rem
    css:
      - assets/styles/neutrinohit-book.css
      - assets/styles/book.css
      - assets/covers/covers.css
    include-in-header:
      - ../../shared/html/mathjax.html
    include-after-body: analytics/cloudflare-web-analytics.html
    theme: cosmo
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-responsive: true
  pdf:
    documentclass: scrbook
    classoption:
      - open=any
    papersize: a4
    fontsize: 11pt
    # Printed TOC is inserted by book-pdf-style.tex immediately after the title page.
    toc: false
    toc-depth: 1
    toc-title: "Содержание"
    number-sections: true
    number-depth: 3
    colorlinks: true
    pdf-engine: lualatex
    keep-tex: true
    geometry:
      - top=18mm
      - bottom=20mm
      - inner=20mm
      - outer=50mm
      - marginparwidth=36mm
      - marginparsep=6mm
      - headheight=6mm
      - headsep=5mm
      - footskip=9mm
    filters:
      - assets/filters/book-pdf-style.lua
    include-in-header:
      - ../../shared/latex/neutrinohit-book.tex
      - ../../shared/latex/ru-lang.tex
      - assets/latex/book-pdf-style.tex
      - assets/covers/covers.tex
      - assets/latex/cover-title.tex
    include-after-body: assets/covers/back-cover.tex
  epub:
    toc: true
    toc-depth: 2
    number-sections: true
    css:
      - assets/styles/neutrinohit-book.css
      - assets/styles/book.css
