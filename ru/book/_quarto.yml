project:
  type: book
  output-dir: _book

book:
  title: "Статистический анализ данных"
  subtitle: "От вероятности к физическому результату"
  author: "Дмитрий В. Наумов"
  site-url: "https://neutrinohit.github.io/statistical-analysis-course/ru/book/"
  repo-url: "https://github.com/NeutrinoHit/statistical-analysis-course"
  repo-subdir: "ru/book"
  repo-actions: [source, issue]
  search: true
  reader-mode: true
  page-footer:
    left: "© Дмитрий В. Наумов"
    right: "NeutrinoHit · Статистический анализ данных"
  chapters:
    - index.qmd
    - preface.qmd
    - syllabus.qmd
    - part: "I. Язык данных"
      chapters:
        - chapters/why_statistics.qmd
        - chapters/probability.qmd
        - chapters/poisson_gaussian.qmd
    - part: "II. Оценивание и подгонка"
      chapters:
        - chapters/likelihood.qmd
        - chapters/fitting.qmd
    - part: "III. Статистический вывод"
      chapters:
        - chapters/intervals.qmd
        - chapters/feldman_cousins.qmd
        - chapters/hypothesis_tests.qmd
    - part: "IV. Реальный анализ"
      chapters:
        - chapters/systematics.qmd
        - chapters/neutrino_cases.qmd
    - part: "Вычислительные лаборатории"
      chapters:
        - notebooks/probability_demo.qmd
        - notebooks/poisson_gaussian_demo.qmd
        - notebooks/likelihood_demo.qmd
        - notebooks/fitting_demo.qmd
        - notebooks/intervals_demo.qmd
        - notebooks/feldman_cousins_demo.qmd
        - notebooks/hypothesis_tests_demo.qmd
        - notebooks/systematics_demo.qmd
        - notebooks/neutrino_cases_demo.qmd

bibliography: ../../shared/bib/references.bib
lang: ru

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    css: ../../shared/styles/book.css
    include-in-header:
      - ../../shared/html/mathjax.html
    include-after-body: analytics/cloudflare-web-analytics.html
    theme: cosmo
    code-copy: true
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    fig-responsive: true
  pdf:
    documentclass: scrbook
    toc: true
    number-sections: true
    pdf-engine: lualatex
    include-in-header:
      - ../../shared/latex/common-pdf.tex
      - ../../shared/latex/ru-lang.tex
