<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="60 20 1280 880" width="1280" height="880">

  <rect width="1400" height="920" fill="#000000"/>

  <style>
    text {
      fill: #ffffff;
      font-family: "DejaVu Sans", Arial, Helvetica, sans-serif;
      font-weight: 400;
    }
    .eq    { font-size: 30px; }
    .mid   { font-size: 28px; }
    .tiny  { font-size: 15px; opacity: 0.96; }
    .line  { stroke: #ffffff; stroke-opacity: 0.78; stroke-width: 2; }
    .accent { font-weight: 600; }
    .darkLabel { fill: #111111; }
  </style>

  <defs>
    <path id="hatch" d="M -4,8 l 16,-16 v 8 l -16,16" fill="none" stroke-width="3"/>
    <g id="hatch_rev">
      <use xlink:href="#hatch" transform="matrix(1,0 0,-1 0,8)"/>
    </g>

    <mask id="mask_a">
      <use xlink:href="#hatch_rev" stroke="#ffffff"/>
    </mask>

    <pattern id="pattern_a" patternUnits="userSpaceOnUse" width="8" height="8">
      <use xlink:href="#hatch" stroke="#cc8800" opacity="0.35"/>
    </pattern>

    <pattern id="pattern_b" patternUnits="userSpaceOnUse" width="8" height="8">
      <use xlink:href="#hatch_rev" stroke="#0066ff" opacity="0.35"/>
    </pattern>

    <pattern id="pattern_i" patternUnits="userSpaceOnUse" width="8" height="8">
      <use xlink:href="#hatch"     stroke="#cc8800" opacity="0.30"/>
      <use xlink:href="#hatch_rev" stroke="#0066ff" opacity="0.30"/>
      <use xlink:href="#hatch"     stroke="#66cc99" mask="url(#mask_a)" opacity="0.85"/>
    </pattern>

    <path id="aShape"
          d="M 25,0 L 13,-24 H -13 L -25,0 L -13,24 H 13 Z"
          fill="url(#pattern_a)" stroke="#cc8800" stroke-width="2.4"/>

    <circle id="bShape" cx="0" cy="0" r="25"
            fill="url(#pattern_b)" stroke="#0066ff" stroke-width="2.4"/>

    <g id="iShape">
      <path d="M 0,-20 A 25,25 0 0 0 0,20 L 10,0 Z"
            fill="url(#pattern_i)" stroke="#0066ff" stroke-width="2.2"/>
      <path d="M 0,-20 L 10,0 L 0,20"
            fill="none" stroke="#cc8800" stroke-width="2.2"/>
    </g>

    <symbol id="iconU" viewBox="0 0 104 74">
      <rect x="2" y="2" width="100" height="70" rx="10"
            fill="#e3e3e3" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    </symbol>

    <symbol id="iconA" viewBox="0 0 104 74">
      <use xlink:href="#aShape" transform="translate(52,36)"/>
      <text x="52" y="40" class="tiny" text-anchor="middle">A</text>
    </symbol>

    <symbol id="iconB" viewBox="0 0 104 74">
      <use xlink:href="#bShape" transform="translate(52,36)"/>
      <text x="52" y="40" class="tiny" text-anchor="middle">B</text>
    </symbol>

    <symbol id="iconI" viewBox="0 0 104 74">
      <use xlink:href="#iShape" transform="translate(52,36)"/>
    </symbol>
  </defs>

  <!-- large diagram -->
  <g transform="translate(0,8)">
    <rect x="455" y="34" width="490" height="278" rx="24"
          fill="#e3e3e3" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2.2"/>

    <g transform="translate(700,172) scale(4.2)">
      <use xlink:href="#aShape" transform="translate(-15,0)"/>
      <use xlink:href="#bShape" transform="translate(15,0)"/>
      <use xlink:href="#iShape"/>
    </g>

    <text x="575" y="182" class="mid darkLabel" text-anchor="middle">A</text>
    <text x="826" y="182" class="mid darkLabel" text-anchor="middle">B</text>
    <text x="700" y="182" class="mid darkLabel" text-anchor="middle">A∩B</text>
  </g>

  <!-- row 1 -->
  <g transform="translate(90,390)">
    <text x="0" y="0" class="eq">P(A) =</text>
    <g transform="translate(155,-52)">
      <use href="#iconA" x="0" y="0" width="104" height="74"/>
      <line x1="0" y1="82" x2="104" y2="82" class="line"/>
      <use href="#iconU" x="0" y="88" width="104" height="74"/>
    </g>

    <text x="332" y="0" class="eq">,</text>
    <text x="372" y="0" class="eq">P(B|A) =</text>
    <g transform="translate(570,-52)">
      <use href="#iconI" x="0" y="0" width="104" height="74"/>
      <line x1="0" y1="82" x2="104" y2="82" class="line"/>
      <use href="#iconA" x="0" y="88" width="104" height="74"/>
    </g>

    <text x="744" y="0" class="eq">⇒</text>
    <text x="806" y="0" class="eq">P(A) · P(B|A) =</text>
    <g transform="translate(1110,-52)">
      <use href="#iconI" x="0" y="0" width="104" height="74"/>
      <line x1="0" y1="82" x2="104" y2="82" class="line"/>
      <use href="#iconU" x="0" y="88" width="104" height="74"/>
    </g>
  </g>

  <!-- row 2 -->
  <g transform="translate(90,620)">
    <text x="0" y="0" class="eq">P(B) =</text>
    <g transform="translate(155,-52)">
      <use href="#iconB" x="0" y="0" width="104" height="74"/>
      <line x1="0" y1="82" x2="104" y2="82" class="line"/>
      <use href="#iconU" x="0" y="88" width="104" height="74"/>
    </g>

    <text x="332" y="0" class="eq">,</text>
    <text x="372" y="0" class="eq">P(A|B) =</text>
    <g transform="translate(570,-52)">
      <use href="#iconI" x="0" y="0" width="104" height="74"/>
      <line x1="0" y1="82" x2="104" y2="82" class="line"/>
      <use href="#iconB" x="0" y="88" width="104" height="74"/>
    </g>

    <text x="744" y="0" class="eq">⇒</text>
    <text x="806" y="0" class="eq">P(B) · P(A|B) =</text>
    <g transform="translate(1110,-52)">
      <use href="#iconI" x="0" y="0" width="104" height="74"/>
      <line x1="0" y1="82" x2="104" y2="82" class="line"/>
      <use href="#iconU" x="0" y="88" width="104" height="74"/>
    </g>
  </g>

  <!-- final box -->
  <g>
    <rect x="385" y="780" width="630" height="98" rx="18"
          fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.2"/>
    <text x="700" y="842" class="mid accent" text-anchor="middle">
      P(A|B)P(B) = P(B|A)P(A)
    </text>
  </g>
</svg>
